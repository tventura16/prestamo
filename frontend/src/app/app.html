<header class="bg-navy text-white shadow-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
    <div class="flex items-center gap-3">
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-navy-light text-lg font-bold">$</span>
      <h1 class="m-0 text-base font-semibold sm:text-lg">{{ title() }}</h1>
    </div>

    <!-- Navegación horizontal (desktop) -->
    <nav class="hidden flex-1 items-center justify-center gap-1 md:flex">
      <a routerLink="/" routerLinkActive="bg-navy-light !text-white" [routerLinkActiveOptions]="{ exact: true }"
         class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white">Dashboard</a>
      <a routerLink="/clientes" routerLinkActive="bg-navy-light !text-white"
         class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white">Clientes</a>
      <a routerLink="/prestamos" routerLinkActive="bg-navy-light !text-white"
         class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white">Préstamos</a>
      <a routerLink="/pagos" routerLinkActive="bg-navy-light !text-white"
         class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white">Pagos</a>
      <a routerLink="/reportes" routerLinkActive="bg-navy-light !text-white"
         class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white">Reportes</a>
      <a routerLink="/documentos" routerLinkActive="bg-navy-light !text-white"
         class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white">Documentos</a>
    </nav>

    <!-- Usuario + logout (desktop) / botón menú (móvil) -->
    <div class="flex items-center gap-2 sm:gap-3">
      @if (kc.username()) {
        <span class="hidden text-sm text-slate-300 lg:inline">{{ kc.username() }}</span>
      }
      <button type="button" (click)="logout()"
              class="hidden rounded-md border border-white/20 px-3 py-1.5 text-sm text-slate-200 transition hover:bg-white/10 hover:text-white md:inline-block">
        Salir
      </button>
      <button type="button" (click)="toggleMenu()" aria-label="Abrir menú"
              class="inline-flex h-9 w-9 items-center justify-center rounded-md text-xl hover:bg-white/10 md:hidden">
        {{ menuOpen() ? '✕' : '☰' }}
      </button>
    </div>
  </div>

  <!-- Navegación desplegable (móvil) -->
  @if (menuOpen()) {
    <nav class="flex flex-col gap-1 border-t border-white/10 px-4 pb-3 pt-2 md:hidden">
      <a routerLink="/" routerLinkActive="bg-navy-light !text-white" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()"
         class="rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-white/10 hover:text-white">Dashboard</a>
      <a routerLink="/clientes" routerLinkActive="bg-navy-light !text-white" (click)="closeMenu()"
         class="rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-white/10 hover:text-white">Clientes</a>
      <a routerLink="/prestamos" routerLinkActive="bg-navy-light !text-white" (click)="closeMenu()"
         class="rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-white/10 hover:text-white">Préstamos</a>
      <a routerLink="/pagos" routerLinkActive="bg-navy-light !text-white" (click)="closeMenu()"
         class="rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-white/10 hover:text-white">Pagos</a>
      <a routerLink="/reportes" routerLinkActive="bg-navy-light !text-white" (click)="closeMenu()"
         class="rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-white/10 hover:text-white">Reportes</a>
      <a routerLink="/documentos" routerLinkActive="bg-navy-light !text-white" (click)="closeMenu()"
         class="rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-white/10 hover:text-white">Documentos</a>
      @if (kc.username()) {
        <button type="button" (click)="logout()"
                class="mt-1 rounded-md border border-white/20 px-3 py-2 text-left text-sm text-slate-200 hover:bg-white/10">
          Salir ({{ kc.username() }})
        </button>
      }
    </nav>
  }
</header>

<main class="mx-auto max-w-7xl p-4 sm:p-6">
  <router-outlet />
</main>
