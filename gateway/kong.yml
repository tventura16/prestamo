# ───────────────────────────────────────────────
# Plugins globales
# ───────────────────────────────────────────────
plugins:

  # CORS — permite al frontend Angular consumir el gateway
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Idempotency-Key
        - X-Auth-Token
        - X-Request-ID
      exposed_headers:
        - X-Auth-Token
        - X-Request-ID
      credentials: true
      max_age: 3600

  # Inyecta un Request ID en cada request para trazabilidad
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # Logs estructurados a stdout (capturados por Docker)
  - name: file-log
    config:
      path: /dev/stdout

  # Headers de seguridad
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options:nosniff"
          - "X-Frame-Options:SAMEORIGIN"
          - "Referrer-Policy:strict-origin-when-cross-origin"

  # Métricas Prometheus expuestas en :8001/metrics
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

# ───────────────────────────────────────────────
# Autenticación JWT — consumer con la clave pública del realm
# ───────────────────────────────────────────────
# El plugin `jwt` (por servicio) valida firma RS256 + exp y casa el claim `iss`
# del token con el `key` de este jwt_secret. La clave pública corresponde al
# keypair fijo embebido en el realm import (keycloak/import/realm-prestamos.json,
# componente rsa-imported-prestamos), así es determinista entre rebuilds.
# La autorización por roles permanece en cada microservicio (defensa en profundidad).
consumers:
  - username: keycloak-prestamos
    jwt_secrets:
      - key: "http://localhost:8080/realms/prestamos"   # == claim iss de los tokens
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA25r05sBqtGeHGyS2Sgpo
          nQr5xdSY2N8AvacmgVBFu1M8S44uonUzY67vpPyZyAy/EVVsTusqq4GzPF5Ga13j
          FnaVsuvUnC3quY23LYnP8XkJLphDD5kDQi6EcUSdaqNApF843pjkcjdB0AA2Ra86
          Je/Ftfp6k2DCoaW/+PMJOAQSke+lSmKMhZYFuGDqqs7rN5fLD4WFy4SAU+dpS6ax
          lMcssrXQrAzkVclSN1C4tQZlSeY2cBtAecO5tilD+YSVvGDr5J2O8ZvoKLjgkp3g
          9EbVYkiMTY/61XKT+Pib+UW3mxm7pfmALrC8jJHVBaee83mDgXCMd5rpEAsdD7BT
          XwIDAQAB
          -----END PUBLIC KEY-----
