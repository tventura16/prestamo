    url: http://payment-service:8083
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: payments-route
        paths:
          - /payments
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
    plugins:
      - name: jwt
        config:
          key_claim_name: iss          # casa el claim iss del token con el jwt_secret del consumer
          claims_to_verify:
            - exp                       # rechaza tokens expirados
          run_on_preflight: false       # deja pasar el preflight CORS (OPTIONS sin token)
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  # ───── Report Service ─────
  - name: report-service
    url: http://report-service:8084
    retries: 3
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: reports-route
        paths:
          - /reports
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
    plugins:
      - name: jwt
        config:
          key_claim_name: iss          # casa el claim iss del token con el jwt_secret del consumer
          claims_to_verify:
            - exp                       # rechaza tokens expirados
          run_on_preflight: false       # deja pasar el preflight CORS (OPTIONS sin token)
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  # ───── Document Service ─────
  - name: document-service
    url: http://document-service:8085
    retries: 3
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: documents-route
        paths:
          - /documents
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
    plugins:
      - name: jwt
        config:
          key_claim_name: iss          # casa el claim iss del token con el jwt_secret del consumer
          claims_to_verify:
            - exp                       # rechaza tokens expirados
          run_on_preflight: false       # deja pasar el preflight CORS (OPTIONS sin token)
      - name: rate-limiting
