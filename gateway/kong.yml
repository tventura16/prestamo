_format_version: "3.0"
_transform: true

# ───────────────────────────────────────────────
# Services y rutas
# ───────────────────────────────────────────────
services:

  # ───── Auth Service (Keycloak) ─────
  - name: auth-service
    url: http://auth-service:8080
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false
        preserve_host: true

  # ───── Client Service ─────
  - name: client-service
    url: http://client-service:8081
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: clients-route
        paths:
          - /clients
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
    plugins:
      - name: jwt
        config:
          key_claim_name: iss          # casa el claim iss del token con el jwt_secret del consumer
          claims_to_verify:
            - exp                       # rechaza tokens expirados
          run_on_preflight: false       # deja pasar el preflight CORS (OPTIONS sin token)
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  # ───── Loan Service ─────
  - name: loan-service
    url: http://loan-service:8082
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: loans-route
        paths:
          - /loans
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
    plugins:
      - name: jwt
        config:
          key_claim_name: iss          # casa el claim iss del token con el jwt_secret del consumer
          claims_to_verify:
            - exp                       # rechaza tokens expirados
          run_on_preflight: false       # deja pasar el preflight CORS (OPTIONS sin token)
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  # ───── Payment Service ─────
