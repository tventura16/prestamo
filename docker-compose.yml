name: prestamos

services:

  # ───────────────────────────────────────────────
  # Frontend
  # ───────────────────────────────────────────────
  frontend:
    image: prestamos/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prestamos-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend-net
    depends_on:
      - api-gateway

  # ───────────────────────────────────────────────
  # API Gateway
  # ───────────────────────────────────────────────
  api-gateway:
    image: kong:3.9
    container_name: prestamos-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - frontend-net
      - backend-net

  # ───────────────────────────────────────────────
  # Auth Service - Keycloak
  # ───────────────────────────────────────────────
  auth-service:
    image: quay.io/keycloak/keycloak:26.0
    container_name: prestamos-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-prestamos}
      KC_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido (ver .env.example / scripts/gen-secrets.sh)}
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD no definido (ver .env.example)}
    ports:
      - "8080:8080"
    volumes:
      - keycloakdata:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    networks:
      - backend-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy

  # ───────────────────────────────────────────────
  # Microservicios Go
  # ───────────────────────────────────────────────
  client-service:
    image: prestamos/client-service:latest
    build:
      context: ./services/client-service
      dockerfile: Dockerfile
    container_name: prestamos-client-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: client-service
      SERVICE_PORT: 8081
      SERVICE_HOST: prestamos-client-service
      CONSUL_ADDR: consul:8500
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clientes
      DB_USER: ${DB_USER:-prestamos}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido (ver .env.example / scripts/gen-secrets.sh)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KEYCLOAK_URL: http://auth-service:8080
      LOG_LEVEL: info
    ports:
      - "8081:8081"
    networks:
      - backend-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      consul:
        condition: service_started

  loan-service:
    image: prestamos/loan-service:latest
    build:
      context: ./services/loan-service
      dockerfile: Dockerfile
    container_name: prestamos-loan-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: loan-service
      SERVICE_HOST: prestamos-loan-service
      CONSUL_ADDR: consul:8500
      SERVICE_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: prestamos
      DB_USER: ${DB_USER:-prestamos}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido (ver .env.example / scripts/gen-secrets.sh)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KEYCLOAK_URL: http://auth-service:8080
      LOG_LEVEL: info
      GARANTIAS_STORE_PATH: /var/garantias
    ports:
      - "8082:8082"
    volumes:
      - garantiasstore:/var/garantias
    networks:
      - backend-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  payment-service:
    image: prestamos/payment-service:latest
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: prestamos-payment-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: payment-service
      SERVICE_HOST: prestamos-payment-service
      CONSUL_ADDR: consul:8500
      SERVICE_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pagos
      DB_NAME_PRESTAMOS: prestamos
      DB_USER: ${DB_USER:-prestamos}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido (ver .env.example / scripts/gen-secrets.sh)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-prestamos}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD no definido (ver .env.example)}@rabbitmq:5672/
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KEYCLOAK_URL: http://auth-service:8080
      LOG_LEVEL: info
    ports:
      - "8083:8083"
    networks:
      - backend-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  report-service:
    image: prestamos/report-service:latest
    build:
      context: ./services/report-service
      dockerfile: Dockerfile
    container_name: prestamos-report-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: report-service
      SERVICE_HOST: prestamos-report-service
      CONSUL_ADDR: consul:8500
      SERVICE_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME_PAGOS: pagos
      DB_NAME_PRESTAMOS: prestamos
      DB_NAME_CLIENTES: clientes
      DB_USER: ${DB_USER:-prestamos}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido (ver .env.example / scripts/gen-secrets.sh)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KEYCLOAK_URL: http://auth-service:8080
      LOG_LEVEL: info
    ports:
      - "8084:8084"
    networks:
      - backend-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  document-service:
    image: prestamos/document-service:latest
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
    container_name: prestamos-document-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: document-service
      SERVICE_HOST: prestamos-document-service
      CONSUL_ADDR: consul:8500
      SERVICE_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: documentos
      DB_NAME_CLIENTES: clientes
      DB_NAME_PRESTAMOS: prestamos
      DB_NAME_PAGOS: pagos
      DB_USER: ${DB_USER:-prestamos}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido (ver .env.example / scripts/gen-secrets.sh)}
      KAFKA_BROKERS: kafka:9092
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KEYCLOAK_URL: http://auth-service:8080
      DOCUMENT_STORE_PATH: /var/documents
      LOG_LEVEL: info
    ports:
      - "8085:8085"
    volumes:
      - documentstore:/var/documents
    networks:
      - backend-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ───────────────────────────────────────────────
  # Service Discovery
  # ───────────────────────────────────────────────
  consul:
    image: hashicorp/consul:1.21
    container_name: prestamos-consul
    restart: unless-stopped
    command: agent -server -bootstrap -ui -client=0.0.0.0
    ports:
      - "8500:8500"
    volumes:
      - consuldata:/consul/data
    networks:
      - backend-net

  # ───────────────────────────────────────────────
  # Bus de eventos
  # ───────────────────────────────────────────────
  kafka:
    image: apache/kafka:4.0.0
    container_name: prestamos-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - backend-net

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: prestamos-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-prestamos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD no definido (ver .env.example)}
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_prometheus"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rmqdata:/var/lib/rabbitmq
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ───────────────────────────────────────────────
  # Persistencia
  # ───────────────────────────────────────────────
  postgres:
    image: postgres:18
    container_name: prestamos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-prestamos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido (ver .env.example / scripts/gen-secrets.sh)}
      POSTGRES_DB: prestamos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prestamos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: prestamos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - data-net

  # ───────────────────────────────────────────────
  # Observabilidad
  # ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: prestamos-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks:
      - backend-net
      - observability-net

  grafana:
    image: grafana/grafana:12.0.0
    container_name: prestamos-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD no definido (ver .env.example)}
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability-net
    depends_on:
      - prometheus

# ───────────────────────────────────────────────
# Redes
# ───────────────────────────────────────────────
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge
    # internal: true   # descomentar para producción: bloquea acceso desde el host
  observability-net:
    driver: bridge

# ───────────────────────────────────────────────
# Volúmenes persistentes
# ───────────────────────────────────────────────
volumes:
  pgdata:
  redisdata:
  rmqdata:
  kafkadata:
  consuldata:
  keycloakdata:
  grafanadata:
  prometheusdata:
  documentstore:
  garantiasstore:
